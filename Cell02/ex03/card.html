<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>

    <h1 class="header-title">User Profile Card</h1>

    <div class="card">
        
        <table class="invisible-table">
            
            <tr>
                <td class="no-padding">
                    <img src="img2.jpg" alt="Profile Picture" class="profile-pic">
                </td>
            </tr>
            
            <tr>
                <td>
                    <h2 class="login">Schookho</h2>
                </td>
            </tr>
            
            <tr>
                <td class="desc-cell">
                    <p class="desc">Level 67, Kub</p>
                    <p class="school">KMITL</p>
                </td>
            </tr>
            
            <tr>
                <td>
                    <div class="socials">
                        <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/1006/1006771.png" alt="Web"></a>
                        <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="Twitter"></a>
                        <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/174/174857.png" alt="LinkedIn"></a>
                        <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="Facebook"></a>
                    </div>
                </td>
            </tr>
            
            <tr>
                <td class="no-padding">
                    <button class="contact-btn">Contact</button>
                </td>
            </tr>
            
        </table>
    </div>

</body>
</html>
