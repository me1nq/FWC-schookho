<!DOCTYPE html>
<html>
<head>
    <title>Tab</title>
    <style>
        table {
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 20px;
        }
        td {
            border: 1px solid black; 
            width: 50%; 
            padding: 50px 10px; 
        }
        .box-left {
            background-color: #b8ba75; 
            color: darkgreen; 
        }
        .box-right {
            background-color: #f3c2b3; 
            color: darkred; 
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td class="box-left">First cell</td>
            <td class="box-right">Second cell</td>
        </tr>
    </table>

</body>
</html>
