<!DOCTYPE html>
<html>
<head>
    <title>Basics</title>
    <style>
        body {
            background-color: pink;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: white;
            text-align: center;
            font-size: 3em; 
        }
        .container {
            display: flex;
            justify-content: center; 
            gap: 50px;
            margin-bottom: 40px;
        }
        .shop-box {
            text-align: center;
        }
        .shop-box img {
            width: 300px;
            height: auto;
            margin-bottom: 10px;
        }
        hr {
            border: 1px solid black; 
        }
        .footer {
            text-align: right; 
            font-style: italic; 
            font-family: monospace; 
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Welcome to Online Shops !</h1>
    <div class="container">
        <div class="shop-box">
            <img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg" alt="Amazon Logo">
            <br>
            <a href="https://www.amazon.com">Go to Amazon</a>
        </div>

        <div class="shop-box">
            <img src="https://upload.wikimedia.org/wikipedia/commons/f/fe/Shopee.svg" alt="Shopee Logo">
            <br>
            <a href="https://shopee.co.th">Go to Shopee</a>
        </div>

    </div>
    <hr>

    <div class="footer">
        &copy; schookho 2026
    </div>

</body>
</html>
